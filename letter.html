<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Our Story</title>
        <style>
            :root {
                --rose: #ff7ea8;
                --pink: #ffc3d5;
                --blush: #ffeaf2;
                --lavender: #eae0ff;
                --ivory: #fffdf8;
                --text: #613d54;
                --line: rgba(132, 79, 98, 0.18);
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family: Arial, Helvetica, sans-serif;
                color: var(--text);
                background:
                    radial-gradient(circle at top left, rgba(255,255,255,0.9), transparent 30%),
                    linear-gradient(135deg, #fff6fa 0%, #ffe2ee 30%, #f6d9e8 52%, #eadfff 100%);
                position: relative;
            }

            .background-collage {
                position: fixed;
                inset: 0;
                z-index: 0;
                background:
                    linear-gradient(rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.22)),
                    linear-gradient(120deg, rgba(255, 192, 214, 0.4), rgba(210, 196, 255, 0.35)),
                    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200"><rect width="100%" height="100%" fill="%23fdf1f6"/><g fill="none" stroke="%23f3b1c9" stroke-width="2"><rect x="40" y="50" width="300" height="260" rx="20" fill="%23fffafc"/><rect x="430" y="170" width="320" height="240" rx="22" fill="%23ffe7f0"/><rect x="780" y="90" width="290" height="280" rx="18" fill="%23f3ebff"/><rect x="210" y="470" width="340" height="250" rx="20" fill="%23fef3f9"/><rect x="640" y="520" width="320" height="240" rx="18" fill="%23fff0f6"/><rect x="30" y="820" width="360" height="240" rx="20" fill="%23f4ebff"/><rect x="510" y="860" width="300" height="260" rx="22" fill="%23fffafc"/><rect x="880" y="770" width="220" height="230" rx="18" fill="%23fde8f3"/></g></svg>');
                background-size: cover;
                background-position: center;
                filter: saturate(0.9) blur(1px);
            }

            .page {
                position: relative;
                z-index: 1;
                width: 100%;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 36px 18px;
            }

            .floating-heart {
                position: absolute;
                width: 20px;
                height: 20px;
                background: rgba(255, 126, 168, 0.7);
                transform: rotate(-45deg);
                border-radius: 4px;
                animation: floatHeart 5s ease-in-out infinite;
                opacity: 0.9;
            }

            .floating-heart::before,
            .floating-heart::after {
                content: "";
                position: absolute;
                width: 20px;
                height: 20px;
                background: rgba(255, 126, 168, 0.7);
                border-radius: 50%;
            }

            .floating-heart::before {
                top: -10px;
                left: 0;
            }

            .floating-heart::after {
                left: 10px;
                top: 0;
            }

            .floating-heart.one { top: 8%; left: 10%; animation-delay: 0s; }
            .floating-heart.two { top: 18%; right: 14%; animation-delay: 1s; }
            .floating-heart.three { bottom: 18%; left: 18%; animation-delay: 1.8s; }
            .floating-heart.four { bottom: 12%; right: 18%; animation-delay: 2.4s; }
            .floating-heart.five { top: 38%; left: 7%; animation-delay: 0.7s; }
            .floating-heart.six { top: 42%; right: 10%; animation-delay: 1.6s; }

            .letter-box {
                width: min(100%, 980px);
                background: rgba(255, 255, 255, 0.38);
                border: 1px solid rgba(255,255,255,0.7);
                box-shadow: 0 25px 60px rgba(121, 77, 96, 0.15);
                border-radius: 30px;
                padding: 28px;
                backdrop-filter: blur(8px);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                margin: auto;
            }

            .photo-strip {
                display: grid;
                grid-template-columns: repeat(3, minmax(160px, 1fr));
                gap: 18px;
                width: 100%;
                margin-bottom: 26px;
            }

            .photo-box {
                position: relative;
                height: 220px;
                border-radius: 22px;
                background: rgba(255,255,255,0.32);
                border: 2px dashed rgba(255, 126, 168, 0.45);
                display: flex;
                align-items: center;
                justify-content: center;
                color: rgba(97, 61, 84, 0.7);
                font-size: 1rem;
                text-align: center;
                padding: 18px;
                box-shadow: inset 0 0 20px rgba(255,255,255,0.2);
                overflow: hidden;
                cursor: default;
            }

            .photo-box.has-image {
                cursor: pointer;
            }

            .photo-box:not(.has-image) * {
                pointer-events: none;
            }

            .photo-box:not(.has-image) .upload-hint {
                pointer-events: auto;
            }

            .photo-box img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: none;
                border-radius: 18px;
            }

            .photo-box span {
                position: relative;
                z-index: 1;
            }

            .photo-box input {
                position: absolute;
                inset: 0;
                opacity: 0;
                pointer-events: none;
            }

            .photo-box .upload-hint {
                position: absolute;
                inset: auto 10px 10px 10px;
                padding: 8px 12px;
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.72);
                border: 1px solid rgba(255, 126, 168, 0.34);
                color: #7d4963;
                font-size: 0.72rem;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                opacity: 0.9;
                cursor: pointer;
                z-index: 2;
                font-family: inherit;
            }

            .photo-menu {
                position: absolute;
                top: 10px;
                right: 10px;
                display: none;
                flex-direction: column;
                gap: 8px;
                padding: 10px 12px;
                border-radius: 14px;
                background: rgba(96, 53, 74, 0.86);
                border: 1px solid rgba(255,255,255,0.5);
                box-shadow: 0 10px 24px rgba(53, 28, 39, 0.2);
                z-index: 4;
            }

            .photo-box .photo-menu.show {
                display: flex;
            }

            .photo-menu button {
                border: none;
                background: rgba(255,255,255,0.12);
                color: #fff;
                border-radius: 10px;
                padding: 8px 10px;
                font-size: 0.8rem;
                font-weight: 700;
                cursor: pointer;
                transition: background 0.2s ease, transform 0.2s ease;
            }

            .photo-menu button:hover,
            .photo-menu button:focus-visible {
                background: rgba(255,255,255,0.2);
                transform: translateY(-1px);
            }

            .letter {
                width: 100%;
                min-height: 320px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(255, 253, 250, 0.9);
                border: 2px solid rgba(255, 172, 197, 0.8);
                border-radius: 22px;
                box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8);
                padding: 28px 30px;
                background-image: linear-gradient(to bottom, transparent 0, transparent 28px, rgba(255, 168, 196, 0.18) 29px);
                background-size: 100% 30px;
            }

            .back-button {
                display: inline-block;
                margin-top: 22px;
                padding: 14px 32px;
                border: none;
                border-radius: 999px;
                background: linear-gradient(135deg, #ff7ea8, #ff9abf 50%, #c7a4ff 100%);
                color: #fff;
                font-size: 1rem;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-decoration: none;
                box-shadow: 0 14px 28px rgba(255, 126, 168, 0.32);
                transition: transform 0.2s ease, box-shadow 0.2s ease;
                cursor: pointer;
            }

            .back-button:hover,
            .back-button:focus-visible {
                transform: translateY(-2px);
                box-shadow: 0 18px 32px rgba(255, 126, 168, 0.38);
            }

            .actions {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-top: 8px;
            }

            .credit-line {
                margin-top: 10px;
                font-size: 0.8rem;
                letter-spacing: 0.08em;
                text-transform: lowercase;
                color: rgba(109, 58, 82, 0.8);
            }

            .letter h1 {
                margin: 0 0 18px;
                text-align: center;
                font-size: clamp(2rem, 4vw, 3rem);
                color: #8b4468;
            }

            .letter p {
                margin: 0 0 18px;
                font-size: 1.08rem;
                line-height: 1.9;
                color: var(--text);
            }

            .letter-editor {
                width: 100%;
                max-width: 760px;
                min-height: 220px;
                resize: vertical;
                display: block;
                margin: 0 auto;
                border: 2px solid rgba(255, 172, 197, 0.8);
                border-radius: 18px;
                background: rgba(255, 255, 255, 0.74);
                padding: 18px 20px;
                font: inherit;
                line-height: 1.9;
                color: var(--text);
                text-align: center;
                box-shadow: inset 0 0 12px rgba(255, 192, 214, 0.18);
            }

            .letter-editor:focus {
                text-align: left;
                vertical-align: top;
                outline: 3px solid rgba(255, 126, 168, 0.22);
                outline-offset: 2px;
            }

            .placeholder-text {
                margin: 20px 0 28px;
                text-align: center;
                font-size: clamp(1.6rem, 3vw, 2.4rem);
                font-weight: 700;
                color: #9a5c7a;
                letter-spacing: 0.04em;
            }

            .signature {
                text-align: right;
                font-weight: 700;
                font-style: italic;
                margin-top: 24px;
            }

            @keyframes floatHeart {
                0%, 100% {
                    transform: rotate(-45deg) translateY(0px) scale(1);
                    opacity: 0.7;
                }
                50% {
                    transform: rotate(-45deg) translateY(-14px) scale(1.12);
                    opacity: 1;
                }
            }

            @media (max-width: 700px) {
                .page {
                    padding: 18px 12px;
                    align-items: flex-start;
                }

                .letter-box {
                    padding: 18px 14px;
                    border-radius: 22px;
                }

                .photo-strip {
                    grid-template-columns: repeat(3, minmax(80px, 1fr));
                    gap: 10px;
                }

                .photo-box {
                    height: 120px;
                    border-radius: 16px;
                    font-size: 0.72rem;
                    padding: 10px;
                }

                .letter {
                    min-height: 220px;
                    padding: 18px 16px;
                }

                .letter-editor {
                    min-height: 180px;
                    padding: 14px 16px;
                    font-size: 0.95rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="background-collage" aria-hidden="true"></div>
        <div class="floating-heart one" aria-hidden="true"></div>
        <div class="floating-heart two" aria-hidden="true"></div>
        <div class="floating-heart three" aria-hidden="true"></div>
        <div class="floating-heart four" aria-hidden="true"></div>
        <div class="floating-heart five" aria-hidden="true"></div>
        <div class="floating-heart six" aria-hidden="true"></div>

        <main class="page">
            <div class="letter-box">
                <section class="photo-strip" aria-label="Shared memories photo area">
                    <div class="photo-box">
                        <input type="file" accept="image/*" data-image-target="photo-1">
                        <span>yet to come</span>
                        <img id="photo-1" alt="Memory 1">
                    </div>
                    <div class="photo-box">
                        <input type="file" accept="image/*" data-image-target="photo-2">
                        <span>yet to come</span>
                        <img id="photo-2" alt="Memory 2">
                    </div>
                    <div class="photo-box">
                        <input type="file" accept="image/*" data-image-target="photo-3">
                        <span>yet to come</span>
                        <img id="photo-3" alt="Memory 3">
                    </div>
                </section>

                <article class="letter">
                    <textarea id="letterEditor" class="letter-editor" aria-label="Write your letter">walay butang kay wala man kay uyab</textarea>
                </article>

                <div class="actions">
                    <a href="index.html" class="back-button">okay na</a>
                    <div class="credit-line">made by keben</div>
                </div>
            </div>
        </main>

        <script>
            const params = new URLSearchParams(window.location.search);
            const cameFromIndex = params.get('from') === 'index';

            if (!cameFromIndex && window.location.pathname.toLowerCase().endsWith('letter.html')) {
                window.location.href = 'index.html';
            }

            const fileInputs = document.querySelectorAll('input[type="file"]');
            const photoBoxes = document.querySelectorAll('.photo-box');
            const STORAGE_KEY = 'our-story-photo-memory';
            const LETTER_KEY = 'our-story-letter-text';
            const letterEditor = document.getElementById('letterEditor');

            function getPhotoState() {
                const state = {};

                photoBoxes.forEach((label) => {
                    const input = label.querySelector('input');
                    const targetId = input.dataset.imageTarget;
                    const image = document.getElementById(targetId);

                    state[targetId] = {
                        src: image.src || '',
                        hasImage: image.style.display === 'block'
                    };
                });

                return state;
            }

            function savePhotoState() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(getPhotoState()));
            }

            function saveLetterState() {
                localStorage.setItem(LETTER_KEY, letterEditor.value);
            }

            function restoreLetterState() {
                const saved = localStorage.getItem(LETTER_KEY);
                letterEditor.value = saved !== null ? saved : 'walay butang kay wala man kay uyab';
            }

            function encodeDraft(draft) {
                return btoa(unescape(encodeURIComponent(JSON.stringify(draft))));
            }

            function decodeDraft(value) {
                return JSON.parse(decodeURIComponent(escape(atob(value))));
            }

            function restoreDraftFromUrl() {
                const params = new URLSearchParams(window.location.search);
                const draft = params.get('draft');
                if (!draft) return;

                try {
                    const state = decodeDraft(draft);

                    if (state.text) {
                        letterEditor.value = state.text;
                        localStorage.setItem(LETTER_KEY, state.text);
                    }

                    if (state.photos) {
                        photoBoxes.forEach((label) => {
                            const input = label.querySelector('input');
                            const targetId = input.dataset.imageTarget;
                            const image = document.getElementById(targetId);
                            const labelText = label.querySelector('span');
                            const savedEntry = state.photos[targetId];

                            if (!savedEntry) return;

                            if (savedEntry.hasImage && savedEntry.src) {
                                image.src = savedEntry.src;
                                image.style.display = 'block';
                                labelText.style.display = 'none';
                            }
                        });

                        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.photos));
                    }
                } catch (error) {
                    console.warn('Could not restore shared draft:', error);
                }
            }

            function restorePhotoState() {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) return;

                try {
                    const state = JSON.parse(saved);

                    photoBoxes.forEach((label) => {
                        const input = label.querySelector('input');
                        const targetId = input.dataset.imageTarget;
                        const image = document.getElementById(targetId);
                        const labelText = label.querySelector('span');
                        const savedEntry = state[targetId];

                        if (!savedEntry) return;

                        if (savedEntry.hasImage && savedEntry.src) {
                            image.src = savedEntry.src;
                            image.style.display = 'block';
                            labelText.style.display = 'none';
                        }
                    });
                } catch (error) {
                    console.warn('Could not restore photos:', error);
                }
            }

            function closeAllMenus() {
                document.querySelectorAll('.photo-menu').forEach((menu) => menu.classList.remove('show'));
            }

            photoBoxes.forEach((label) => {
                const input = label.querySelector('input');
                const targetId = input.dataset.imageTarget;
                const targetImage = document.getElementById(targetId);
                const labelText = label.querySelector('span');
                const menu = document.createElement('div');
                const uploadHint = document.createElement('button');
                uploadHint.type = 'button';
                uploadHint.className = 'upload-hint';
                uploadHint.textContent = 'Upload';
                label.appendChild(uploadHint);
                menu.className = 'photo-menu';
                menu.innerHTML = `
                    <button type="button" data-action="change">Change</button>
                    <button type="button" data-action="delete">Delete</button>
                `;
                label.appendChild(menu);

                input.addEventListener('click', (event) => {
                    event.stopPropagation();
                });

                uploadHint.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    if (input.disabled) return;
                    input.click();
                });

                const openPicker = (event) => {
                    if (event) event.preventDefault();
                    if (input.disabled) return;
                    input.click();
                };

                label.addEventListener('click', (event) => {
                    if (event.target.closest('button') || event.target === uploadHint) {
                        return;
                    }

                    if (targetImage.src && targetImage.style.display === 'block') {
                        closeAllMenus();
                        menu.classList.add('show');
                        return;
                    }

                    return;
                });

                menu.addEventListener('click', (event) => {
                    const actionButton = event.target.closest('button');
                    if (!actionButton) return;

                    const action = actionButton.dataset.action;
                    menu.classList.remove('show');

                    if (action === 'change') {
                        openPicker();
                    }

                    if (action === 'delete') {
                        targetImage.removeAttribute('src');
                        targetImage.style.display = 'none';
                        labelText.style.display = 'block';
                        uploadHint.style.display = 'block';
                        input.value = '';
                        label.classList.remove('has-image');
                        uploadHint.textContent = 'Upload';
                        savePhotoState();
                    }
                });
            });

            fileInputs.forEach((input) => {
                input.addEventListener('change', function(event) {
                    const file = event.target.files[0];
                    const targetId = input.dataset.imageTarget;
                    const targetImage = document.getElementById(targetId);
                    const label = input.parentElement;
                    const labelText = label.querySelector('span');

                    if (file && file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            targetImage.src = e.target.result;
                            targetImage.style.display = 'block';
                            labelText.style.display = 'none';
                            const uploadHint = label.querySelector('.upload-hint');
                            if (uploadHint) {
                                uploadHint.style.display = 'none';
                            }
                            label.classList.add('has-image');
                            input.disabled = false;
                            savePhotoState();
                        };
                        reader.readAsDataURL(file);
                    }
                });
            });

            document.addEventListener('click', (event) => {
                if (!event.target.closest('.photo-box')) {
                    closeAllMenus();
                }
            });

            letterEditor.addEventListener('input', () => {
                saveLetterState();
            });

            restoreLetterState();
            restorePhotoState();
            restoreDraftFromUrl();
        </script>
    </body>
</html>
